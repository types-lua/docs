name: Deploy VitePress docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout compiler (for snippet verification)
        # Cross-repo checkout: works with the default token while
        # types-lua/TypeLua is public. If TypeLua is private, add a
        # fine-grained PAT (read-only on TypeLua contents) as the
        # TYPE_LUA_READ_TOKEN secret in this repo; it is used when set.
        uses: actions/checkout@v4
        with:
          repository: types-lua/TypeLua
          path: typelua
          fetch-depth: 1
          token: ${{ secrets.TYPE_LUA_READ_TOKEN || github.token }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: typelua/go.sum
      - name: Build tlua
        run: go build -o /tmp/tlua ./cmd/tlua
        working-directory: typelua
      - name: Verify every lua snippet passes tlua check
        run: python3 scripts/check_snippets.py /tmp/tlua
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        # Fails early with a clear message when Pages is not enabled
        # (Settings -> Pages -> Source: GitHub Actions). Auto-enable needs a
        # PAT; the default token cannot turn Pages on.
        uses: actions/configure-pages@v5
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
